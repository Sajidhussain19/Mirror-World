services:
  - type: web
    name: mirror-world
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MAX_AGENTS
        value: "500"
      - key: MAX_LIVE_RUNS
        value: "2"
